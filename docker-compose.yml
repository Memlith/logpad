services:
  postgres:
    image: postgres:16-alpine
    container_name: logpad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logpad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logpadpass}
      POSTGRES_DB: ${POSTGRES_DB:-logpad_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-logpad} -d $${POSTGRES_DB:-logpad_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logpad-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-logpad}:${POSTGRES_PASSWORD:-logpadpass}@postgres:5432/${POSTGRES_DB:-logpad_db}?schema=public
      PIN_HASH: ${PIN_HASH}
      SETTINGS_SETUP_KEY: ${SETTINGS_SETUP_KEY}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
